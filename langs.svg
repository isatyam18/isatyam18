<svg width="300" height="100" viewBox="0 0 300 100"
  fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" rx="4.5" width="299" height="99"
        fill="#1a1b27" stroke="#e4e2e2" stroke-opacity="0" />

  <!-- Title -->
  <g transform="translate(25, 28)">
    <text class="header">Most Used Languages</text>
  </g>

  <!-- Bar -->
  <g transform="translate(25, 45)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
    </mask>
    <rect mask="url(#rect-mask)" x="0.0" y="0" width="250.0" height="8" fill="#3572A5" />
        
  </g>

  <!-- Legend -->
  <g transform="translate(25, 67)">
    <g transform="translate(0, 0)"><circle cx="5" cy="6" r="5" fill="#3572A5" /><text x="15" y="10" class="lang-name">Python 100.00%</text></g>
      
  </g>
</svg>